<div class="hm3 chat-card shock-out-of-combat-reminder-card">
  <header class="card-header flexrow">
    <h3>Shock Recovery Required</h3>
  </header>
  <div class="card-content">
    <p><strong>{{actorName}}</strong> has completed the out-of-combat unconscious period and regains consciousness.</p>
    <div><strong>Follow-up Shock Roll:</strong> {{diceCount}}d6 vs Endurance {{endurance}}</div>
  </div>
  <div class="card-buttons">
    <button type="button" data-action="shock-out-of-combat-recover" data-actor-uuid="{{actorUuid}}">
      Make Follow-up Shock Roll
    </button>
    <button type="button" data-action="shock-clear" data-actor-uuid="{{actorUuid}}">
      Clear Shock Recovery
    </button>
  </div>
</div>
