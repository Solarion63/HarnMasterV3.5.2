<div class="hm3 chat-card shock-injury-recovery-reminder-card">
  <header class="card-header flexrow">
    <h3>Shock Recovery Due</h3>
  </header>
  <div class="card-content">
    <p><strong>{{actorName}}</strong> remains in Shock at H{{healRate}} and is due for the four-hour Shock Recovery roll.</p>
    <div><strong>Base Target:</strong> H{{healRate}} × Endurance {{endurance}} = {{baseTarget}}</div>
    <p>An attending Physician adds half their EML to the target. The roll dialog will ask for that EML.</p>
  </div>
  <div class="card-buttons">
    <button type="button"
            data-action="shock-injury-recovery"
            data-actor-uuid="{{actorUuid}}">
      Make Shock Recovery Roll
    </button>
    <button type="button"
            data-action="shock-clear"
            data-actor-uuid="{{actorUuid}}">
      Clear Shock
    </button>
  </div>
</div>
