<div class="hm3-item-description-view">
    {{#if editable}}
        <div class="hm3-item-description-controls hm3-item-description-controls-view">
            <button type="button" class="hm3-item-description-icon-button hm3-item-description-edit-button" title="Edit Description" aria-label="Edit Description">
                <i class="fas fa-pen"></i>
            </button>
        </div>
    {{/if}}
    <div class="hm3-item-description-content">{{{description}}}</div>
</div>
