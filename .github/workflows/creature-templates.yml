name: Creature Template Tests

on:
  push:
    branches:
      - feature/creature-hit-location-templates
    paths:
      - "module/actor/creature-location-templates.js"
      - "module/actor/actor-sheet-v2.js"
      - "templates/actor/creature-sheet.html"
      - "tests/creature-location-templates.test.mjs"
      - ".github/workflows/creature-templates.yml"
  pull_request:
    paths:
      - "module/actor/creature-location-templates.js"
      - "module/actor/actor-sheet-v2.js"
      - "templates/actor/creature-sheet.html"
      - "tests/creature-location-templates.test.mjs"
      - ".github/workflows/creature-templates.yml"

permissions:
  contents: read

jobs:
  creature-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check changed JavaScript syntax
        run: |
          node --experimental-default-type=module --check module/actor/creature-location-templates.js
          node --experimental-default-type=module --check module/actor/actor-sheet-v2.js
      - name: Run creature location template tests
        run: node --experimental-default-type=module --test tests/creature-location-templates.test.mjs
