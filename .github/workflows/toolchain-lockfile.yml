name: Generate Toolchain Lockfile

on:
  push:
    branches:
      - chore/modernize-build-toolchain
    paths:
      - "package.json"
      - "gulpfile.mjs"
      - ".github/workflows/toolchain-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Regenerate package lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile CSS
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Commit generated lockfile and CSS
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json css
          if git diff --cached --quiet; then
            echo "Generated files are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate lockfile and compiled CSS"
          git push
