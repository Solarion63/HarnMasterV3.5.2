name: Validate Build Toolchain

on:
  push:
    branches:
      - master
      - "feature/**"
    paths:
      - "package.json"
      - "package-lock.json"
      - "gulpfile.mjs"
      - "scss/**"
      - "css/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "gulpfile.mjs"
      - "scss/**"
      - "css/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile CSS
        run: npm run build

      - name: Verify compiled CSS is committed
        shell: bash
        run: git diff --exit-code -- css

      - name: Test bounded security advisory exception
        run: node scripts/test-audit-build-dependencies.mjs

      - name: Audit dependencies (only GHSA-vfj7-8cjw-p6xm excepted through 2026-11-30)
        run: node scripts/audit-build-dependencies.mjs
