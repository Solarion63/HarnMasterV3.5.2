name: Validate Build Toolchain

on:
  push:
    branches:
      - master
      - "feature/**"
    paths:
      - "package.json"
      - "package-lock.json"
      - "gulpfile.mjs"
      - "scss/**"
      - "css/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "gulpfile.mjs"
      - "scss/**"
      - "css/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compile CSS
        run: npm run build

      - name: Verify compiled CSS is committed
        shell: bash
        run: git diff --exit-code -- css

      - name: Audit dependencies
        run: npm audit --audit-level=high
