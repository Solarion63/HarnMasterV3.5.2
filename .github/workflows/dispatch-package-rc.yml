name: Dispatch RC Package Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact runtime-tested commit SHA to package
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: Solarion63/HarnMasterV3.5.2/.github/workflows/package-release.yml@master
    with:
      ref: ${{ inputs.ref }}
