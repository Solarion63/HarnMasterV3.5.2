name: Dispatch RC Package Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact tested commit SHA to package
        required: true
        default: b7e44e977de0e6c2913e2ff90e987ff78c29827f
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: Solarion63/HarnMasterV3.5.2/.github/workflows/package-release.yml@feature/foundry-v14-master
    with:
      ref: ${{ inputs.ref }}
