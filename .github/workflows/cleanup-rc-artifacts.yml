name: Cleanup superseded RC artifacts

on:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '23 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without deleting artifacts
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: hm3-rc-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted master
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Verify cleanup safety rules
        run: node scripts/test-plan-rc-artifact-cleanup.cjs

      - name: Inspect and prune eligible RC artifacts
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        with:
          script: |
            const { planCleanup } = require(process.env.GITHUB_WORKSPACE + '/scripts/plan-rc-artifact-cleanup.cjs');
            const { owner, repo } = context.repo;
            const [artifacts, openPulls] = await Promise.all([
              github.paginate(github.rest.actions.listArtifactsForRepo, {owner,repo,per_page:100}),
              github.paginate(github.rest.pulls.list, {owner,repo,state:'open',per_page:100})
            ]);
            const runs = new Map();
            for (const artifact of artifacts) {
              const id = artifact.workflow_run?.id;
              if (!id || runs.has(id)) continue;
              try {
                const result = await github.rest.actions.getWorkflowRun({owner,repo,run_id:id});
                runs.set(id,result.data);
              } catch (error) {
                core.warning('Preserving artifact with unreadable run ' + id + ': ' + error.message);
              }
            }
            const { deleteIds, reasons } = planCleanup(artifacts,runs,openPulls);
            const byId = new Map(artifacts.map(a => [a.id,a]));
            const mib = bytes => (bytes/1048576).toFixed(2);
            const eligibleBytes = deleteIds.reduce((n,id) => n+(byId.get(id)?.size_in_bytes||0),0);
            core.info('Examined ' + artifacts.length + ' artifacts. Protected: ' + JSON.stringify(reasons));
            core.info('Eligible: ' + deleteIds.length + ' artifacts (' + mib(eligibleBytes) + ' MiB)');
            if (process.env.DRY_RUN === 'true') {
              core.info('DRY RUN: no artifacts deleted');
            } else {
              let deleted = 0, failed = 0, recovered = 0;
              for (const id of deleteIds) {
                try {
                  await github.rest.actions.deleteArtifact({owner,repo,artifact_id:id});
                  deleted++;
                  recovered += byId.get(id)?.size_in_bytes || 0;
                } catch (error) {
                  failed++;
                  core.error('Could not delete artifact ' + id + ': ' + error.message);
                }
              }
              core.info('Deleted: ' + deleted + ', failed: ' + failed + ', freed: ' + mib(recovered) + ' MiB');
              if (failed) core.setFailed(failed + ' artifact deletions failed');
            }
