name: Rebuild Compendiums

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/rebuild-compendiums.yml"
      - "packs/esoteric/_source/**"
      - "packs/system-help/_source/**"
      - "scripts/prepare-system-help.mjs"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/foundry-v14-master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Foundry CLI without changing project dependencies
        run: npm install --no-save --ignore-scripts @foundryvtt/foundryvtt-cli@3.0.4

      - name: Verify source documents are present
        shell: bash
        run: |
          esoteric_count=$(find packs/esoteric/_source -maxdepth 1 -type f -name '*.json' | wc -l)
          help_count=$(find packs/system-help/_source -maxdepth 1 -type f -name '*.json' | wc -l)

          echo "Esoterics source documents: ${esoteric_count}"
          echo "System Help source documents: ${help_count}"

          test "${esoteric_count}" -eq 424
          test "${help_count}" -eq 20

      - name: Prepare System Help for Foundry v14
        shell: bash
        run: |
          node scripts/prepare-system-help.mjs packs/system-help/_source .tmp/system-help-v14

      - name: Rebuild Esoterics and System Help packs
        shell: bash
        run: |
          find packs/esoteric -maxdepth 1 -type f -delete
          find packs/system-help -maxdepth 1 -type f -delete

          node --input-type=module <<'NODE'
          import { compilePack } from "@foundryvtt/foundryvtt-cli";

          await compilePack("packs/esoteric/_source", "packs/esoteric", { log: true });
          await compilePack(".tmp/system-help-v14", "packs/system-help", { log: true });
          NODE

      - name: Verify compiled Welcome link content
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { ClassicLevel } from "classic-level";

          const db = new ClassicLevel("packs/system-help", { valueEncoding: "utf8" });
          await db.open();

          const welcomePageKeyPrefix = "!journal.pages!CT4P5XgVp0c0oz2a.";
          const expectedLink = "@UUID[Compendium.hm3.system-help.JournalEntry.BvmWEdDHSifdaM0z]{Characters}";
          let welcomeText = null;

          for await (const [key, value] of db.iterator()) {
            if (!String(key).startsWith(welcomePageKeyPrefix)) continue;
            if (!String(value).includes("Table Of Contents")) continue;
            welcomeText = String(value);
            break;
          }

          await db.close();

          if (!welcomeText) {
            throw new Error("Compiled Welcome text page was not found in System Help LevelDB.");
          }

          if (!welcomeText.includes(expectedLink)) {
            console.error(welcomeText);
            throw new Error(`Compiled Welcome page does not contain expected link: ${expectedLink}`);
          }

          if (welcomeText.includes("@JournalEntry[Characters]")) {
            console.error(welcomeText);
            throw new Error("Compiled Welcome page still contains the legacy Characters JournalEntry link.");
          }

          console.log(`Verified compiled Welcome link: ${expectedLink}`);
          NODE

      - name: Verify generated databases are populated
        shell: bash
        run: |
          esoteric_bytes=$(find packs/esoteric -maxdepth 1 -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          help_bytes=$(find packs/system-help -maxdepth 1 -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')

          echo "Esoterics LevelDB bytes: ${esoteric_bytes}"
          echo "System Help LevelDB bytes: ${help_bytes}"

          test "${esoteric_bytes}" -gt 10000
          test "${help_bytes}" -gt 5000

      - name: Commit rebuilt pack databases
        shell: bash
        run: |
          git add -f packs/esoteric packs/system-help
          if git diff --cached --quiet; then
            echo "Compendium databases are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: compile esoteric and system-help compendiums"

          git pull --rebase origin feature/foundry-v14-master
          git push origin HEAD:feature/foundry-v14-master
