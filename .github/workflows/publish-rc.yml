name: Publish Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release candidate version, for example 2.0.0-rc.3
        required: true
        type: string
      tested_sha:
        description: Exact runtime-tested commit SHA
        required: true
        type: string
      source_run:
        description: Dispatch RC Package Build workflow run ID
        required: true
        type: string
      artifact_digest:
        description: Expected GitHub Actions artifact digest (sha256:...)
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: Release candidate version, for example 2.0.0-rc.3
        required: true
        type: string
      tested_sha:
        description: Exact runtime-tested commit SHA
        required: true
        type: string
      source_run:
        description: Dispatch RC Package Build workflow run ID
        required: true
        type: string
      artifact_digest:
        description: Expected GitHub Actions artifact digest (sha256:...)
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TESTED_SHA: ${{ inputs.tested_sha }}
      SOURCE_RUN: ${{ inputs.source_run }}
      ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
      CHANNEL_TAG: hm3-prerelease-channel
      CHANNEL_ASSET: system.json

    steps:
      - name: Derive release identifiers
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          artifact="hm3-${VERSION}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Verify release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Verify source package run and artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact }}
        run: |
          set -euo pipefail

          run_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}")
          run_conclusion=$(jq -r '.conclusion' <<<"$run_json")

          if [[ "$run_conclusion" != "success" ]]; then
            echo "Package run conclusion is $run_conclusion, not success." >&2
            exit 1
          fi

          artifact_json=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts" \
            --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\")")
          if [[ -z "$artifact_json" ]]; then
            echo "Artifact ${ARTIFACT_NAME} was not found on run ${SOURCE_RUN}." >&2
            exit 1
          fi

          actual_digest=$(jq -r '.digest' <<<"$artifact_json")
          if [[ "$actual_digest" != "$ARTIFACT_DIGEST" ]]; then
            echo "Artifact digest $actual_digest does not match expected $ARTIFACT_DIGEST." >&2
            exit 1
          fi

      - name: Download validated package artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir dist

          test -f "dist/hm3-${VERSION}.zip"
          test -f "dist/hm3-${VERSION}.json"
          test -f "dist/hm3-${VERSION}.source-sha.txt"
          unzip -t "dist/hm3-${VERSION}.zip"

          manifest_version=$(jq -r '.version' "dist/hm3-${VERSION}.json")
          if [[ "$manifest_version" != "$VERSION" ]]; then
            echo "Packaged manifest version $manifest_version does not match requested $VERSION." >&2
            exit 1
          fi

          packaged_sha=$(tr -d '[:space:]' < "dist/hm3-${VERSION}.source-sha.txt")
          if [[ "$packaged_sha" != "$TESTED_SHA" ]]; then
            echo "Packaged source SHA $packaged_sha does not match tested SHA $TESTED_SHA." >&2
            exit 1
          fi

          echo "Verified packaged source SHA: $packaged_sha"

      - name: Verify prerelease distribution metadata
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          manifest="dist/hm3-${VERSION}.json"
          expected_manifest="https://github.com/${GITHUB_REPOSITORY}/releases/download/${CHANNEL_TAG}/${CHANNEL_ASSET}"
          expected_download="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/hm3-${VERSION}.zip"

          actual_manifest=$(jq -r '.manifest // empty' "$manifest")
          actual_download=$(jq -r '.download // empty' "$manifest")

          if [[ "$actual_manifest" != "$expected_manifest" ]]; then
            echo "Manifest URL does not match prerelease channel URL." >&2
            echo "Expected: $expected_manifest" >&2
            echo "Actual:   $actual_manifest" >&2
            exit 1
          fi
          if [[ "$actual_download" != "$expected_download" ]]; then
            echo "Download URL does not match immutable versioned release asset." >&2
            echo "Expected: $expected_download" >&2
            echo "Actual:   $actual_download" >&2
            exit 1
          fi

      - name: Publish prerelease from tested runtime SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ARTIFACT_NAME: ${{ steps.release.outputs.artifact }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          HarnMaster 3 ${VERSION} is a Foundry VTT 14.365 release candidate.

          This prerelease is published only from an exact runtime-tested commit and its verified package artifact.

          Tested runtime commit: ${TESTED_SHA}
          Source packaging run: ${SOURCE_RUN}
          Validated Actions artifact: ${ARTIFACT_NAME}
          Actions artifact digest: ${ARTIFACT_DIGEST}

          See CHANGELOG.md for the detailed ${VERSION} changes and validation scope.
          EOF

          gh release create "$TAG" \
            "dist/hm3-${VERSION}.zip#HarnMaster 3 ${VERSION} system package" \
            "dist/hm3-${VERSION}.json#HarnMaster 3 ${VERSION} manifest" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TESTED_SHA" \
            --title "HarnMaster 3 ${VERSION}" \
            --notes-file release-notes.md \
            --prerelease

      - name: Update stable prerelease manifest channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cat > channel-notes.md <<EOF
          Stable manifest endpoint for HarnMaster 3 prerelease updates.

          The system.json asset on this channel is replaced only after a versioned release candidate has been published from an exact validated package artifact.
          EOF
            gh release create "$CHANNEL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TESTED_SHA" \
              --title "HarnMaster 3 Prerelease Update Channel" \
              --notes-file channel-notes.md \
              --prerelease
          fi

          cp "dist/hm3-${VERSION}.json" "$CHANNEL_ASSET"
          gh release upload "$CHANNEL_TAG" "$CHANNEL_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published release and prerelease channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,targetCommitish,assets,url
          gh release view "$CHANNEL_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,assets,url
